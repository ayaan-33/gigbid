name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repo policy (secrets, frozen gigsim, prompts, traced numbers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.5" }
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/checks/check_gigsim_frozen.py
      - run: uv run python scripts/checks/check_prompts_location.py
      - run: uv run python scripts/checks/check_numbers_traced.py
      - name: .env must never be committed
        run: test -z "$(git ls-files | grep -E '(^|/)\.env$')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.5" }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --prefix apps/web
      - run: npm run --prefix apps/web lint
      - run: npm run --prefix apps/web typecheck

  unit-contract:
    name: Unit + contract tests (MCP in-memory, graphs, schema snapshots)
    runs-on: ubuntu-latest
    env:
      GIGBID_FAKE_LLM: "1"
      LANGFUSE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.5" }
      - run: uv sync --frozen --extra dev
      - name: Cache embedding/reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('agent/config.yaml') }}
      - run: uv run pytest -q tests/unit mcp_servers tests/contract
        env: { FASTEMBED_CACHE_PATH: ~/.cache/fastembed }

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      CI: "1"
      E2E_PG: postgresql://gigbid:gigbid@localhost:5432
      REVIEWER_PASSWORD: ci-reviewer-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.5" }
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --prefix apps/web
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: ./scripts/e2e_stack.sh
      - run: cd apps/web && npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, mcp, gigsim]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: apps/web, file: infra/docker/web.Dockerfile, push: false }
