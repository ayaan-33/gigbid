name: Smoke eval
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: 30-job smoke eval with failure thresholds
    runs-on: ubuntu-latest
    env:
      LANGFUSE_DISABLED: "1"
      FASTEMBED_CACHE_PATH: ~/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.5" }
      - run: uv sync --frozen --extra dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('agent/config.yaml') }}
      - name: Smoke eval (fails if unsupported claims rise or bid/skip F1 drops past thresholds)
        run: uv run python -m evals.runners.smoke --jobs 30
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: smoke-eval, path: evals/results/smoke_eval.json }
