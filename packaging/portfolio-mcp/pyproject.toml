[project]
name = "ayaan33-gigbid-portfolio-mcp"
version = "1.0.0"
description = "MCP server that lets an AI assistant search YOUR freelance portfolio for evidence (case studies, repos, reviews, past proposals) and cite it."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "freelance", "portfolio", "rag", "claude"]
dependencies = [
  "mcp>=1.13,<2", "pydantic>=2.8", "pyyaml>=6.0", "python-dotenv>=1.0", "numpy>=1.26",
  "fastembed>=0.5", "rank-bm25>=0.2.2", "pypdf>=5.0", "starlette", "uvicorn>=0.30",
]

[project.scripts]
ayaan33-gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the server plus the retrieval code it depends on, sourced from the monorepo
packages = ["src/mcp_servers", "src/rag", "src/agent", "src/scripts"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent/config.yaml" = "agent/config.yaml"
