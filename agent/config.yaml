# GigBid runtime configuration.
# Every model, budget, threshold and business rule lives here (never in code) so a
# platform policy change is absorbed by editing this file + prompts only.
# ${VAR:default} is expanded from the environment by agent/settings.py.

marketplace:
  mode: ${MARKETPLACE_MODE:gigsim}          # gigsim | upwork_live
  max_requests_per_minute: 20               # stays under GigSim's 30 rpm/token limit
  live_poll_interval_minutes: 240           # live Upwork: at most every 4h (RUNBOOK justifies)
  gigsim_poll_interval_minutes: 30

# Two open-weight profiles (free only). A `paid` profile is intentionally absent:
# this project uses no paid APIs. Every node's model is chosen here, never in code.
models:
  profile: ${MODEL_PROFILE:open}
  profiles:
    open:                                    # deployed link: hosted open models on Groq free tier
      provider: groq
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      small: openai/gpt-oss-20b
      large: openai/gpt-oss-120b
      fallback_small: qwen/qwen3.8-27b       # 1k output tokens/min on free tier: small outputs only
      fallback_large: openai/gpt-oss-20b
      injection_guard: meta-llama/llama-prompt-guard-2-86m
      tokens_per_minute: 7500                # Groq free tier: 8k TPM per model (client-side pacing)
      # Groq list prices (USD per 1M tokens). We run on the FREE tier, so actual spend is $0;
      # these list prices are used only to report a comparable "cost if paid" figure.
      prices_usd_per_mtok:
        openai/gpt-oss-20b: {input: 0.075, output: 0.30}
        openai/gpt-oss-120b: {input: 0.15, output: 0.60}
        qwen/qwen3.8-27b: {input: 0.29, output: 0.59}
    open_local:                              # laptop: Ollama on Apple M3 16GB
      provider: ollama
      base_url: ${OLLAMA_BASE_URL:http://localhost:11434}/v1
      api_key_env: null
      small: qwen3:4b
      large: qwen3:4b
      fallback_small: qwen3:4b
      fallback_large: qwen3:4b
      prices_usd_per_mtok: {}
  nodes:                                     # tier per node: small = cheap/frequent, large = quality
    scout: small
    analyst: small
    risk_assessor: small
    fit_matcher: small
    decision: small
    pricing: small
    writer: large
    verifier: small
    critic: large
    compliance: small
    intent: small
    client_liaison: large
    judge: large
    simulated_client: small
    data_generator: large
    contextual: small
  temperature:
    default: 0.2
    writer: 0.6
    data_generator: 0.8
  request_timeout_s: 60
  reasoning_effort:                        # gpt-oss only; hidden reasoning tokens count against free limits
    default: low
    writer: medium
    critic: medium
    judge: medium
  rate_limit_wait_budget_s: 90             # total time a call may wait on provider 429s
  max_output_tokens:                       # explicit caps keep requests inside free-tier limits
    default: 900
    analyst: 900
    risk_assessor: 600
    writer: 1400
    verifier: 1200
    critic: 700
    compliance: 1400
    intent: 300
    client_liaison: 500
    judge: 500
  max_retries: 2
  embeddings: nomic-ai/nomic-embed-text-v1.5
  embedding_dim: 768
  # chosen by evals/results/reranker_bench.json: within 0.02 Recall@5 of bge-reranker-v2-m3 at 1/10 the latency
  reranker: Xenova/ms-marco-MiniLM-L-6-v2
  reranker_fallback: Xenova/ms-marco-MiniLM-L-6-v2
  reranker_quality: BAAI/bge-reranker-v2-m3-int8   # measured alternative (10x slower on CPU)

rag:
  variant: ${RAG_VARIANT:v3_rerank}          # final value set from evals/results/rag_variants.json
  top_k: 5
  candidate_k: 30
  rerank_k: 15                               # candidates sent to the cross-encoder
  rerank_doc_chars: 700
  chunk_tokens: 350
  chunk_overlap: 50
  rrf_k: 60
  outcome_boost: {won: 0.25, replied: 0.12, ignored: -0.10}
  corrective_min_score: 0.35
  corrective_max_requeries: 2
  max_proposals_in_top_k: 2

budgets:
  max_graph_steps: 40
  max_revisions: 2                           # Critic may send back at most twice
  max_tokens_per_job: 30000
  max_tokens_per_conversation_turn: 12000
  declared_p95_latency_s:
    job_analysed: 25
    proposal: 60
  declared_cost_usd:
    job_analysed: 0.002
    proposal: 0.006

thresholds:
  minimum_fit_score: 0.55
  watch_fit_score: 0.40
  maximum_risk_score: 0.60
  scam_risk_score: 0.80
  min_supported_claim_ratio: 0.85
  proposal_max_words: 260
  proposal_min_words: 90

connects:
  weekly_budget_default: 80
  value_per_connect_usd: 0.15                # bid if expected value >= connects * this
  min_expected_win_prob: 0.05

# Platform policy (mirrors data/policy_pack). Version bumps here absorb change requests.
policy:
  version: 1
  forbid_off_platform_contact: true
  forbid_guarantees: true
  forbid_unpaid_trial_work: true
  require_ai_disclosure: false
  connects_surcharge:
    enabled: false
    proposals_threshold: 20
    extra_connects: 4

memory:
  style:
    min_occurrences: 3                       # an edit pattern must appear in >=3 ...
    window: 10                               # ... of the user's last 10 edits
  outcome:
    min_outcomes: 5                          # >=5 outcomes in a category
    min_lift: 0.10                           # and >=10pt reply-rate lift over the category baseline

autonomy:
  default_level: suggest                     # suggest | auto_skip   (auto-send does not exist)
  auto_skip_below_fit: 0.30

guardrails:
  injection_classifier: true
  spotlight_untrusted: true
  mask_pii_in_logs: true

worker:
  max_concurrent_jobs: 3
  job_timeout_s: 300

upwork_live:
  tool_map: null              # null = adapter defaults (mcp_servers/marketplace/adapters/upwork_live.py);
                              # override here if Upwork renames a tool: {search_jobs: [new_name], ...}

mcp:
  transport: ${MCP_TRANSPORT:http}   # http (MultiServerMCPClient) | inprocess (tests, evals)
  timeout_s: 30
  max_retries: 2
  servers:
    portfolio: ${PORTFOLIO_MCP_URL:http://localhost:8091/mcp}
    marketplace: ${MARKETPLACE_MCP_URL:http://localhost:8092/mcp}
    workspace: ${WORKSPACE_MCP_URL:http://localhost:8093/mcp}
  # A6: each agent gets only the tools it needs, filtered by name
  allowlists:
    scout: {marketplace: [search_jobs, get_job, list_events, marketplace_status]}
    analyst: {}
    risk_assessor: {marketplace: [get_job, get_client_history]}
    fit_matcher: {portfolio: [search_evidence, list_skills, get_case_study]}
    pricing: {marketplace: [get_market_stats, get_connects_balance, get_client_history, get_policy]}
    writer: {portfolio: [search_evidence, get_case_study]}
    verifier: {portfolio: [search_evidence]}
    critic: {portfolio: [search_evidence]}
    compliance: {}
    client_liaison:
      marketplace: [list_conversations, list_messages, send_message]
      workspace: [find_free_slots, create_interview_hold, create_email_draft]
      portfolio: [search_evidence]
    submitter: {marketplace: [create_proposal_draft, submit_proposal, get_connects_balance, marketplace_status]}
    pipeline_sync: {marketplace: [list_events, list_conversations, marketplace_status]}

nodes:
  max_attempts: 2
  timeouts:                 # seconds; every node is bounded
    default: 120
    writer: 180
    critic: 120
    fit_matcher: 120
    client_liaison: 150
