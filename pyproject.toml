[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: a multi-agent freelancer copilot (LangGraph + Advanced RAG + MCP)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  # Agents / MCP
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "langgraph-supervisor>=0.0.29",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-mcp-adapters>=0.1.9",
  "mcp>=1.13",
  # Data / storage
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  # RAG
  "fastembed>=0.5",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "pypdf>=5.0",
  "reportlab>=4.2",
  # Eval / stats
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "pandas>=2.2",
  # Ops
  "httpx>=0.27",
  "tenacity>=9.0",
  "langfuse>=3.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "openpyxl>=3.1.5",
  "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "respx>=0.21",
  "syrupy>=4.7",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "apps", "rag", "mcp_servers", "worker", "gigsim", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "mcp_servers"]
markers = [
  "integration: needs running services (postgres, gigsim)",
  "llm: calls an LLM (skipped in CI unless cached)",
]
